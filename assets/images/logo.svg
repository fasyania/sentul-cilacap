<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none" role="img" aria-label="Tirta Sentul Waterpark &amp; Hall Logo">
  <defs>
    <linearGradient id="tsGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="tsGradNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="tsGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- ICON MONOGRAM "S" (scale 0.58, x=4, y=3) -->
  <g transform="translate(2, 3) scale(0.58)">
    <!-- Shadow / Depth Stroke Bawah -->
    <path d="M 24 64 C 36 76 60 76 74 64 C 77 61 79 56 77 52 C 75 58 70 66 58 70 C 44 74 30 70 24 64 Z" fill="url(#tsGradNavy)" />

    <!-- Ombak Bawah (Wave Curl S) -->
    <path d="M 22 58 C 34 50 48 58 64 54 C 76 50 80 38 72 28 C 76 38 70 52 56 56 C 42 60 30 52 18 56 C 14 57 16 60 22 58 Z" fill="url(#tsGradPrimary)" />

    <!-- Ombak Atas (Top Wave Crest S) -->
    <path d="M 70 26 C 62 14 44 12 32 18 C 22 23 20 34 26 44 C 34 54 48 56 58 50 C 46 56 30 52 24 40 C 18 28 26 18 38 14 C 52 10 66 14 70 26 Z" fill="url(#tsGradPrimary)" />

    <!-- Aksen Highlight Ombak Atas -->
    <path d="M 38 17 C 48 14 60 17 66 26 C 62 20 52 16 40 18 C 32 20 26 26 24 32 C 24 26 28 20 38 17 Z" fill="url(#tsGradLight)" opacity="0.8" />

    <!-- Aksen Pusaran Tengah (Navy Shadow Loop) -->
    <path d="M 44 26 C 36 30 34 36 38 42 C 44 48 54 50 62 44 C 52 48 40 44 36 36 C 34 30 38 26 44 26 Z" fill="url(#tsGradNavy)" />

    <!-- Percikan Tetesan Air (Water Drops Top Right) -->
    <path d="M 76 16 C 76 11 81 6 83 4 C 85 6 90 11 90 16 C 90 20 87 23 83 23 C 79 23 76 20 76 16 Z" fill="url(#tsGradPrimary)" />
    <path d="M 88 27 C 88 24 91 21 92 20 C 93 21 95 24 95 27 C 95 29 93.5 31 91.5 31 C 89.5 31 88 29 88 27 Z" fill="#38bdf8" />
    <circle cx="70" cy="8" r="2.5" fill="#38bdf8" />
  </g>

  <!-- LOGOTYPE TEXT -->
  <text x="66" y="34" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="22" font-weight="700" fill="#0284c7">Tirta <tspan fill="#0a192f" font-weight="800">Sentul</tspan></text>
  <text x="67" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="2.8">WATERPARK &amp; HALL</text>
</svg>
